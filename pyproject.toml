[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-forecaster"
version = "0.1.0"
description = "Shadow-only XAUUSD 30-minute forecasting foundation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "googlenewsdecoder==0.1.7",
    "requests==2.32.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
xauusd_forecaster = ["*.schema.json"]

[tool.setuptools.packages.find]
include = ["xauusd_forecaster*"]
