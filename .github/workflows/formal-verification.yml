name: Formal verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-control-model:
    name: Release Control TLC
    runs-on: ubuntu-latest
    # The complete safety graph includes the post-activation legacy-writer and
    # distinct valid, wrong-key, tampered, and stale Access receipt paths. It
    # reaches 58.01M safety states in about 12.5 minutes; retain every path and
    # bounded headroom for the subsequent liveness temporal-property check.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Check Release Control safety and liveness
        run: python scripts/run_tla_model.py
