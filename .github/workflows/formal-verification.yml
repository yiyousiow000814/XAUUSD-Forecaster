name: Formal verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-control-model:
    name: Release Control TLC
    runs-on: ubuntu-latest
    # The reachable post-activation legacy-writer path doubles the complete
    # safety graph to 26.57M generated states. Hosted runners need just over
    # five minutes on a cold disk, so retain the full model with bounded headroom.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Check Release Control safety and liveness
        run: python scripts/run_tla_model.py
