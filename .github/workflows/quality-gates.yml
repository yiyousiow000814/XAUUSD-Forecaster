name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-regression-suite:
    name: Python regression suite
    runs-on: ubuntu-latest
    # The platform-neutral suite now covers more than 1,300 contracts and can
    # cross seven minutes on a cold hosted runner. Keep the per-test timeout
    # below as the hang detector while leaving enough room for the complete gate.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-timeout
      - name: Check architecture imports
        run: python scripts/check_architecture_imports.py --root .
      - name: Run the complete Python suite
        # PowerShell/cscript behavior is covered by the bounded Windows runtime
        # workflow; every platform-neutral test remains in this fast full gate.
        run: >-
          python -m pytest -q --timeout=30 --timeout-method=thread
          --ignore=tests/runtime/test_control_center_contracts.py
          --ignore=tests/runtime/test_control_plane_install.py

  web-build-and-tests:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the lockfile npm version
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run the complete Web suite
        run: npm test
