name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-regression-suite:
    name: Python regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-timeout
      - name: Run the complete Python suite
        # PowerShell/cscript behavior is covered by the bounded Windows runtime
        # workflow; every platform-neutral test remains in this fast full gate.
        run: >-
          python -m pytest -q --timeout=30 --timeout-method=thread
          --ignore=tests/test_runtime_launchers.py

  web-build-and-tests:
    name: Web build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the lockfile npm version
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run the complete Web suite
        run: npm test
