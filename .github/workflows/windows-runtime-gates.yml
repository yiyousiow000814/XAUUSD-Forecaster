name: Windows runtime gates

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ctrader/**"
      - "scripts/**"
      - "xauusd_forecaster/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "ctrader/**"
      - "scripts/**"
      - "xauusd_forecaster/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    name: Windows runtime contracts
    runs-on: windows-latest
    # The mandatory real cross-version recovery rehearsal brings the test step
    # to about 6.5 minutes, plus native-wheel setup. Keep each test fail-closed
    # at 30 seconds below while allowing bounded end-to-end runner variance.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-timeout
      - name: Run Windows runtime contracts
        run: >-
          python -m pytest -q --timeout=30 --timeout-method=thread
          tests/test_runtime_health.py
          tests/test_news_scheduler.py
          tests/test_runtime_root_ownership.py
          tests/test_cross_version_runtime_recovery.py
          tests/test_runtime_launchers.py
          tests/test_control_plane_install.py
          tests/test_artifact_path_migration.py::test_real_repair_entrypoint_preserves_source_authority_and_fails_closed
