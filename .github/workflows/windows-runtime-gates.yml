name: Windows runtime gates

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ctrader/**"
      - "scripts/**"
      - "xauusd_forecaster/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "ctrader/**"
      - "scripts/**"
      - "xauusd_forecaster/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    name: Windows runtime contracts
    runs-on: windows-latest
    # A warm Windows runner spends about 90 seconds installing native wheels and
    # about 70 seconds on these contracts. Leave bounded room for runner variance.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-timeout
      - name: Run Windows runtime contracts
        run: >-
          python -m pytest -q --timeout=30 --timeout-method=thread
          tests/test_runtime_health.py
          tests/test_news_scheduler.py
          tests/test_runtime_launchers.py
          tests/test_control_plane_install.py
