name: Windows runtime gates

on:
  pull_request:
    paths:
      - ".github/workflows/windows-runtime-gates.yml"
      - "scripts/run_news_annotator.py"
      - "scripts/xauusd_control_center.ps1"
      - "scripts/xauusd_watchdog*.ps1"
      - "scripts/xauusd_watchdog*.vbs"
      - "xauusd_forecaster/forward_ledger.py"
      - "xauusd_forecaster/news_scheduler.py"
      - "xauusd_forecaster/runtime_health.py"
      - "tests/test_news_scheduler.py"
      - "tests/test_runtime_health.py"
      - "tests/test_runtime_launchers.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-runtime-gates.yml"
      - "scripts/run_news_annotator.py"
      - "scripts/xauusd_control_center.ps1"
      - "scripts/xauusd_watchdog*.ps1"
      - "scripts/xauusd_watchdog*.vbs"
      - "xauusd_forecaster/forward_ledger.py"
      - "xauusd_forecaster/news_scheduler.py"
      - "xauusd_forecaster/runtime_health.py"
      - "tests/test_news_scheduler.py"
      - "tests/test_runtime_health.py"
      - "tests/test_runtime_launchers.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contracts:
    name: Windows runtime contracts
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-timeout
      - name: Run Windows runtime contracts
        run: >-
          python -m pytest -q --timeout=30 --timeout-method=thread
          tests/test_runtime_health.py
          tests/test_news_scheduler.py
          tests/test_runtime_launchers.py
