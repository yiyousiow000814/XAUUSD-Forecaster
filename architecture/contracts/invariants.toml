schema = "architecture-contracts-v1"

[[contract]]
id = "DECISION-FIXED-CADENCE"
statement = "Decision evaluates only on the fixed eligible clock and never backfills a closed interval."
owner = "xauusd_forecaster.decision"
risk = "CRITICAL"
fact_ids = ["node:decision", "node:business-runtime"]
document = "docs/design/DECISION_AND_EVIDENCE.md"
required_evidence = ["TEST_BOUND", "TEST_EXECUTED", "RUNTIME_OBSERVED"]

[[contract]]
id = "DECISION-LAST-GOOD-MODEL"
statement = "Decision continues with the last valid model while Training is blocked or unavailable."
owner = "xauusd_forecaster.decision"
risk = "CRITICAL"
fact_ids = ["edge:published-model-to-decision", "node:training"]
document = "docs/design/TRAINING_AND_MODELS.md"
required_evidence = ["TEST_BOUND", "TEST_EXECUTED"]

[[contract]]
id = "EVIDENCE-APPEND-ONLY"
statement = "Decision and outcome evidence is immutable and append-only."
owner = "xauusd_forecaster.evidence"
risk = "CRITICAL"
fact_ids = ["node:evidence", "edge:decision-to-evidence"]
document = "docs/contracts/FORWARD_ONLY.md"
required_evidence = ["TEST_BOUND", "TEST_EXECUTED", "RUNTIME_OBSERVED"]

[[contract]]
id = "TRAINING-NOT-DUE-FIRST"
statement = "The NOT_DUE gate executes before expensive training materialization or reconstruction."
owner = "xauusd_forecaster.training"
risk = "CRITICAL"
fact_ids = ["node:training-materialization", "node:training"]
document = "docs/design/TRAINING_AND_MODELS.md"
required_evidence = ["TEST_BOUND", "TEST_EXECUTED"]

[[contract]]
id = "TRAINING-MATERIALIZATION-BOUNDED"
