risk = "CRITICAL"
fact_ids = ["edge:evidence-to-materialization"]
document = "docs/contracts/ARCHITECTURE_RULES.md"
required_evidence = ["TEST_BOUND", "TEST_EXECUTED"]

[[contract]]
id = "DASHBOARD-CRITICAL-BOUNDED"
