schema = "architecture-mutations-v1"

[[mutation]]
id = "MUT-TRAINING-NOT-DUE-FIRST"
contract_id = "TRAINING-NOT-DUE-FIRST"
platform = "PYTHON"
required_isolation = "TEMPORARY_GIT_WORKTREE"
path = "xauusd_forecaster/training/generation.py"
selector_kind = "python_symbol"
symbol = "train_due_v2"
operator = "replace_exact"
before = "if eligible_count < PREVIEW_ROWS:"
after = "if False and eligible_count < PREVIEW_ROWS:"
expected_break = "The early NOT_DUE/engineering gate no longer prevents materialization."
command = ["python", "-m", "pytest", "-q", "tests/evidence/test_integrity_v2.py::test_not_due_gate_does_not_materialize_training_rows"]
timeout_seconds = 90
smoke = true
failure_pattern = "NOT_DUE|materialize"

