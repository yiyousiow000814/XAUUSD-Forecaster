[[mutation]]
id = "MUT-MOBILE-PATH-PRESERVED"
contract_id = "MOBILE-PATH-SHEET-INDEPENDENCE"
platform = "WEB"
required_isolation = "TEMPORARY_GIT_WORKTREE"
path = "web/app/_lib/architecture-mobile-interaction.ts"
selector_kind = "typescript_function"
symbol = "architectureMobileInteractionReducer"
operator = "replace_exact"
before = "return state.mobilePanel === \"INSPECTOR\" ? closePanel(state) : state;"
after = "return state.mobilePanel === \"INSPECTOR\" ? { ...closePanel(state), activePathNodeId: null } : state;"
expected_break = "Closing Inspector clears the selected graph path."
command = ["node", "--import", "./tests/register-cloudflare-worker-loader.mjs", "--test", "--test-name-pattern", "mobile 3: closing Inspector preserves the active path", "tests/architecture-mobile-interaction.test.mjs"]
timeout_seconds = 90
smoke = true
failure_pattern = "active path|failed|assert"

